server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.conf;
  }

  location / {
    try_files $uri/index.html $uri =404;
    include /etc/nginx/conf.d/security-headers.conf;
  }
}
